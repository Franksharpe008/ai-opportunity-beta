name: Live Shift V10 In-Place Production

on:
  push:
    branches:
      - live-shift-command-v10-recovery
    paths:
      - 'live-shift-command-beta/continuation-v10/**'
      - '.github/workflows/live-shift-v10-production.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: live-shift-v10-production
  cancel-in-progress: true

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-v10-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: live-shift-command-beta/continuation-v10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run V10 acceptance
        run: node tests/run-v10-acceptance.js
      - name: Build in-place releases from current production baseline
        run: node tools/prepare-inplace-production.mjs
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Authenticate Vercel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_COLOR: '0'
          NO_COLOR: '1'
          CI: '1'
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "Using stored Vercel deployment token."
          else
            echo "Starting Vercel secure device approval."
            rm -f /tmp/vercel-login.log /tmp/vercel-comment.md
            stdbuf -oL -eL vercel login --no-color > /tmp/vercel-login.log 2>&1 &
            LOGIN_PID=$!
            FOUND=0
            for i in $(seq 1 60); do
              sleep 1
              if [ -s /tmp/vercel-login.log ]; then
                cat /tmp/vercel-login.log
                if grep -Eqi 'visit|verify|device|https://|vercel\.com' /tmp/vercel-login.log; then
                  FOUND=1
                  break
                fi
              fi
              if ! kill -0 "$LOGIN_PID" 2>/dev/null; then
                break
              fi
            done
            LOGIN_TEXT=$(tail -40 /tmp/vercel-login.log 2>/dev/null || true)
            {
              echo '### Vercel approval required'
              echo 'This approval authorizes the already-tested V10 release to deploy directly into the existing Live Shift Command manager/mobile projects.'
              echo
              echo '```text'
              echo "$LOGIN_TEXT"
              echo '```'
            } > /tmp/vercel-comment.md
            gh pr comment 1 --body-file /tmp/vercel-comment.md
            if [ "$FOUND" -ne 1 ]; then
              echo "Vercel approval URL was not detected."
              cat /tmp/vercel-login.log || true
              kill "$LOGIN_PID" 2>/dev/null || true
              exit 1
            fi
            wait "$LOGIN_PID"
          fi
      - name: Deploy mobile to existing project
        shell: bash
        run: |
          cd dist-inplace/mobile
          if [ -n "$VERCEL_TOKEN" ]; then
            vercel deploy --prod --yes --token "$VERCEL_TOKEN"
          else
            vercel deploy --prod --yes
          fi
      - name: Deploy manager to existing project
        shell: bash
        run: |
          cd dist-inplace/manager
          if [ -n "$VERCEL_TOKEN" ]; then
            vercel deploy --prod --yes --token "$VERCEL_TOKEN"
          else
            vercel deploy --prod --yes
          fi
      - name: Smoke existing URLs
        run: |
          curl -fsSL https://live-shift-command-v741-mobile.vercel.app/ | grep -q 'LSC V10 INPLACE MOBILE JS'
          curl -fsSL https://live-shift-command-v74.vercel.app/ | grep -q 'LSC V10 INPLACE MANAGER JS'
          curl -fsSL https://live-shift-command-v741-mobile.vercel.app/api/state >/dev/null
          curl -fsSL https://live-shift-command-v74.vercel.app/api/state >/dev/null
